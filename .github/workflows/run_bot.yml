name: Daily Python Trending Archive

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 (UTC 기준) 실행
  workflow_dispatch: # 수동 실행 버튼 활성화 (테스트용)

permissions:
  contents: write # 리포지토리에 파일을 쓸 수 있는 권한 부여

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Scraper
      run: |
        python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add archives/*.md
        # 변경 사항이 있을 때만 커밋 (에러 방지)
        git commit -m "Add trending report for $(date +'%Y-%m-%d')" || exit 0
        git push